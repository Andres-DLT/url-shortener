name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shortener
          POSTGRES_PASSWORD: shortener
          POSTGRES_DB: shortener_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shortener"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Servidor — dependencias
        run: npm ci
        working-directory: server
      - name: Servidor — tests (unitarios + integración con Postgres y Redis)
        run: npm test
        working-directory: server
        env:
          TEST_DATABASE_URL: postgres://shortener:shortener@localhost:5432/shortener_test
          TEST_REDIS_URL: redis://localhost:6379/15

      - name: Cliente — compilar
        run: npm ci && npm run build
        working-directory: client
